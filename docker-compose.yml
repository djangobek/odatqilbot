# Local PostgreSQL for development:  docker compose up -d db
# Matches DATABASE_URL in .env.example. Add a second database for tests if you like:
#   docker compose exec db createdb -U postgres discipline_test
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: discipline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d discipline"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
